services:
  pricing:
    build: .
    image: pricing-grpc-service:dev
    container_name: pricing-grpc-service
    command: ["--seed", "42", "--log-level", "INFO"]
    ports:
      - "50051:50051"  # gRPC
      - "9090:9090"    # Prometheus /metrics
    healthcheck:
      # grpc-health-probe is the canonical k8s/docker check for gRPC services.
      # We do a TCP probe by default; swap to grpc-health-probe in production.
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',50051)); sys.exit(0)"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pricing-prometheus
    depends_on:
      pricing:
        condition: service_healthy
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
