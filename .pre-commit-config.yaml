repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (strict, whole tree)
        # Always run mypy on the whole src/ tree so it can see the generated
        # stubs and apply the project's pyproject.toml overrides. Without
        # pass_filenames=false, pre-commit would feed only changed files.
        pass_filenames: false
        args: ["src"]
        additional_dependencies:
          - grpcio>=1.62.0
          - protobuf>=4.25.0
          - prometheus_client>=0.20.0
