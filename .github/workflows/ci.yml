name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Opt into Node.js 24 runtime for JavaScript actions so deprecation warnings
  # for actions/checkout and actions/setup-python don't pollute the logs.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pricing-grpc-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image starts and serves
        run: |
          set -euo pipefail
          docker run -d --name pricing-ci -p 50051:50051 -p 9090:9090 \
            pricing-grpc-service:ci --seed 1 --log-level INFO
          # Wait for both ports to accept traffic.
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 50051 && nc -z 127.0.0.1 9090; then break; fi
            sleep 0.5
          done
          # /metrics endpoint must respond. Retry to absorb startup jitter.
          curl --silent --show-error --fail \
               --retry 10 --retry-delay 1 --retry-connrefused \
               http://127.0.0.1:9090/metrics > /dev/null
          # Exercise the unary RPC via reflection.
          docker run --rm --network host fullstorydev/grpcurl:latest \
            -plaintext -d '{"symbol":"BTC-USD"}' \
            localhost:50051 pricing.v1.Pricing/GetQuote
          # Health check.
          docker run --rm --network host fullstorydev/grpcurl:latest \
            -plaintext localhost:50051 grpc.health.v1.Health/Check
          docker logs pricing-ci
          docker rm -f pricing-ci
